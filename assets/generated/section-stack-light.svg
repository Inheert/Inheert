<svg xmlns="http://www.w3.org/2000/svg" width="900" height="84" viewBox="0 0 900 84" role="img" aria-label="stack (kind: ConfigMap) — 7 keys"><title>stack (kind: ConfigMap) — 7 keys</title><style>
          .ti { font: 700 24px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; fill: #1f2328; letter-spacing: -.3px; }
          .kd { font: 600 13px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #8250df; }
          .sub { font: 13px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #656d76; }
          .st { font: 600 13px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #1f2328; }
          .flow { stroke-dasharray: 4 6; animation: dash 1.2s linear infinite; }
          @keyframes dash { to { stroke-dashoffset: -20 } }
          .bob { animation: bob 3s ease-in-out infinite; }
          @keyframes bob { 50% { transform: translateY(-3px) } }
          .pop { transform-box: fill-box; transform-origin: center; animation: pop 4s cubic-bezier(.3,1.6,.5,1) infinite both; }
          @keyframes pop { 0% { transform: scale(0) } 12%, 85% { transform: scale(1) } 100% { transform: scale(0) } }
          .drop { animation: drop 4s cubic-bezier(.3,1.3,.5,1) infinite both; }
          @keyframes drop { 0% { transform: translateY(-14px); opacity: 0 } 15%, 85% { transform: none; opacity: 1 } 100% { opacity: 0 } }
        </style>
        <g transform="translate(4 4)"><g class="drop" style="animation-delay:0.0s"><polygon points="32,40 58,50 32,60 6,50" fill="#bf8700"/><polygon points="6,50 32,60 32,64 6,54" fill="#d5b159"/><polygon points="32,60 58,50 58,54 32,64" fill="#e2c98c"/></g><g class="drop" style="animation-delay:0.3s"><polygon points="32,27 58,37 32,47 6,37" fill="#8250df"/><polygon points="6,37 32,47 32,51 6,41" fill="#ae8dea"/><polygon points="32,47 58,37 58,41 32,51" fill="#c7b0f1"/></g><g class="drop" style="animation-delay:0.6s"><polygon points="32,14 58,24 32,34 6,24" fill="#0a7ea4"/><polygon points="6,24 32,34 32,38 6,28" fill="#60abc4"/><polygon points="32,34 58,24 58,28 32,38" fill="#91c5d6"/></g></g>
        <text x="84" y="36"><tspan class="ti">stack</tspan><tspan class="kd" dx="14">kind: ConfigMap</tspan></text>
        <text x="84" y="60" class="sub">the tools I reach for, layer by layer</text>
        <rect x="809.6" y="17" width="82.4" height="26" rx="13" fill="#f6f8fa" stroke="#d0d7de"/>
        <circle cx="823.6" cy="30" r="4" fill="#0a7ea4"/>
        <text x="834.6" y="34.5" class="st">7 keys</text>
        <path id="wire" d="M 84 78 H 892" stroke="#d0d7de" stroke-width="1.5" class="flow"/>
        <circle r="3" fill="#0a7ea4"><animateMotion dur="5s" repeatCount="indefinite"><mpath href="#wire"/></animateMotion></circle>
        </svg>
