<svg xmlns="http://www.w3.org/2000/svg" width="900" height="84" viewBox="0 0 900 84" role="img" aria-label="about (kind: Engineer) — Running"><title>about (kind: Engineer) — Running</title><style>
          .ti { font: 700 24px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; fill: #1f2328; letter-spacing: -.3px; }
          .kd { font: 600 13px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #8250df; }
          .sub { font: 13px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #656d76; }
          .st { font: 600 13px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #1f2328; }
          .flow { stroke-dasharray: 4 6; animation: dash 1.2s linear infinite; }
          @keyframes dash { to { stroke-dashoffset: -20 } }
          .bob { animation: bob 3s ease-in-out infinite; }
          @keyframes bob { 50% { transform: translateY(-3px) } }
          .pop { transform-box: fill-box; transform-origin: center; animation: pop 4s cubic-bezier(.3,1.6,.5,1) infinite both; }
          @keyframes pop { 0% { transform: scale(0) } 12%, 85% { transform: scale(1) } 100% { transform: scale(0) } }
          .drop { animation: drop 4s cubic-bezier(.3,1.3,.5,1) infinite both; }
          @keyframes drop { 0% { transform: translateY(-14px); opacity: 0 } 15%, 85% { transform: none; opacity: 1 } 100% { opacity: 0 } }
        </style>
        <g transform="translate(4 4)"><g class="bob"><polygon points="32,10 56,22 32,34 8,22" fill="#0a7ea4"/><polygon points="8,22 32,34 32,58 8,46" fill="#479ebb"/><path d="M 13 27.5 V 45.5" stroke="#f6f8fa" stroke-opacity=".5"/><path d="M 18 30.0 V 48.0" stroke="#f6f8fa" stroke-opacity=".5"/><path d="M 23 32.5 V 50.5" stroke="#f6f8fa" stroke-opacity=".5"/><path d="M 28 35.0 V 53.0" stroke="#f6f8fa" stroke-opacity=".5"/><polygon points="32,34 56,22 56,46 32,58" fill="#84bed2"/></g></g>
        <text x="84" y="36"><tspan class="ti">about</tspan><tspan class="kd" dx="14">kind: Engineer</tspan></text>
        <text x="84" y="60" class="sub">who I am and what I like to run</text>
        <rect x="801.6" y="17" width="90.4" height="26" rx="13" fill="#f6f8fa" stroke="#d0d7de"/>
        <circle cx="815.58" cy="30" r="4" fill="none" stroke="#1a7f37"><animate attributeName="r" values="4;10" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0" dur="1.6s" repeatCount="indefinite"/></circle><circle cx="815.6" cy="30" r="4" fill="#1a7f37"/>
        <text x="826.6" y="34.5" class="st">Running</text>
        <path id="wire" d="M 84 78 H 892" stroke="#d0d7de" stroke-width="1.5" class="flow"/>
        <circle r="3" fill="#0a7ea4"><animateMotion dur="5s" repeatCount="indefinite"><mpath href="#wire"/></animateMotion></circle>
        </svg>
