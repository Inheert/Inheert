<svg xmlns="http://www.w3.org/2000/svg" width="900" height="84" viewBox="0 0 900 84" role="img" aria-label="languages (kind: Metrics) — Scraped daily"><title>languages (kind: Metrics) — Scraped daily</title><style>
          .ti { font: 700 24px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; fill: #1f2328; letter-spacing: -.3px; }
          .kd { font: 600 13px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #8250df; }
          .sub { font: 13px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #656d76; }
          .st { font: 600 13px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #1f2328; }
          .flow { stroke-dasharray: 4 6; animation: dash 1.2s linear infinite; }
          @keyframes dash { to { stroke-dashoffset: -20 } }
          .bob { animation: bob 3s ease-in-out infinite; }
          @keyframes bob { 50% { transform: translateY(-3px) } }
          .pop { transform-box: fill-box; transform-origin: center; animation: pop 4s cubic-bezier(.3,1.6,.5,1) infinite both; }
          @keyframes pop { 0% { transform: scale(0) } 12%, 85% { transform: scale(1) } 100% { transform: scale(0) } }
          .drop { animation: drop 4s cubic-bezier(.3,1.3,.5,1) infinite both; }
          @keyframes drop { 0% { transform: translateY(-14px); opacity: 0 } 15%, 85% { transform: none; opacity: 1 } 100% { opacity: 0 } }
        </style>
