<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150" role="img" aria-label="Most used languages: C, C++, Lua, TypeScript, Python, JavaScript, GLSL"><title>Most used languages: C, C++, Lua, TypeScript, Python, JavaScript, GLSL</title><style>
