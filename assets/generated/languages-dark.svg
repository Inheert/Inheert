<svg xmlns="http://www.w3.org/2000/svg" width="900" height="112" viewBox="0 0 900 112" role="img" aria-label="Most used languages: C, C++, Lua, TypeScript, Python, JavaScript, GLSL"><title>Most used languages: C, C++, Lua, TypeScript, Python, JavaScript, GLSL</title><style>
      .h  { font: 700 16px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; fill: #e6edf3; }
      .sub { font: 12px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #8b949e; }
      .ln { font: 600 14px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; fill: #e6edf3; }
      .pc { font: 12px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #8b949e; }
      .seg { transform-box: fill-box; transform-origin: 0 50%; animation: grow .7s cubic-bezier(.2,.8,.2,1) both; }
      @keyframes grow { from { transform: scaleX(0) } to { transform: scaleX(1) } }
      .lg { animation: show .5s ease-out both; }
      @keyframes show { from { opacity: 0 } to { opacity: 1 } }
    </style>
    <rect x="0.5" y="0.5" width="899" height="111" rx="12" fill="#161b22" stroke="#30363d"/>
