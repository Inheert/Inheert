<svg xmlns="http://www.w3.org/2000/svg" width="900" height="84" viewBox="0 0 900 84" role="img" aria-label="projects (kind: Deployment) — 5/5 Ready"><title>projects (kind: Deployment) — 5/5 Ready</title><style>
          .ti { font: 700 24px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; fill: #1f2328; letter-spacing: -.3px; }
